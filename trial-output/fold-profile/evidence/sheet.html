<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Снимки проверок arm B</title>
<style>
  body { margin: 0; padding: 1.5rem; background: #14161a; color: #e8e6e1; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  figure { margin: 0; background: #1e2126; border: 1px solid #2f343b; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 0.5rem 0.7rem; font-size: 12px; color: #9aa2ad; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Снимки, снятые проверками arm B (fold-profile)</h1>
<div class="grid">
  <figure><img src="01-scene-end.png" alt=""><figcaption>01-scene-end — конец сцены: лист сложен до вертикали, 1440×900</figcaption></figure>
  <figure><img src="08-scene-start.png" alt=""><figcaption>08-scene-start — начало сцены: лист лежит плоско</figcaption></figure>
  <figure><img src="02-short-screen.png" alt=""><figcaption>02-short-screen — 1440×400: сцена не помещается, показаны кадры</figcaption></figure>
  <figure><img src="03-reduced-frames.png" alt=""><figcaption>03-reduced-frames — ручное уменьшение движения из середины сцены</figcaption></figure>
  <figure><img src="04-reduced-system.png" alt=""><figcaption>04-reduced-system — системное уменьшение движения</figcaption></figure>
  <figure><img src="07-frames-390.png" alt=""><figcaption>07-frames-390 — 390×844: кадры столбиком</figcaption></figure>
  <figure><img src="05-no-js.png" alt=""><figcaption>05-no-js — без скриптов: рассказ и кадры читаются</figcaption></figure>
  <figure><img src="06-export-1440.png" alt=""><figcaption>06-export-1440 — собранный экспорт, открытый файлом</figcaption></figure>

</html>
